<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HR360 TechX Employee Login">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HR360 TechX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
  <title>HR360 TechX — Employee Login</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f7fb;
      overflow: hidden;
    }
    .flutter-loader, flt-progress, .loading { display: none !important; }
    #boot-login {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      background: linear-gradient(135deg, #f4f7fb 0%, #ffffff 100%);
      color: #1f2937;
    }
    #boot-login .split { display: flex; width: 100%; min-height: 100%; }
    #boot-login .pane {
      flex: 0 0 38%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #boot-login .card {
      width: min(520px, 100%);
      background: #fff;
      border: 1px solid #e6e8ee;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(20, 24, 31, .08);
      padding: 28px 28px 20px;
      box-sizing: border-box;
    }
    #boot-login .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      font-size: 34px;
      font-weight: 700;
    }
    #boot-login .brand-row img { width: 36px; height: 36px; object-fit: contain; }
    #boot-login h1 { margin: 0; font-size: 30px; font-weight: 700; }
    #boot-login .sub { margin: 4px 0 24px; color: #6b7280; font-size: 15px; }
    #boot-login label { display: block; margin-bottom: 6px; font-size: 14px; }
    #boot-login input[type=text],
    #boot-login input[type=password] {
      width: 100%;
      box-sizing: border-box;
      height: 46px;
      margin-bottom: 14px;
      border: 0;
      border-radius: 12px;
      background: #f9fafb;
      padding: 0 14px;
      font: inherit;
      color: #1f2937;
    }
    #boot-login .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 2px 0 14px;
    }
    #boot-login .check input { width: auto; height: auto; margin: 0; accent-color: #1e4b8c; }
    #boot-login button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #1e4b8c;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: default;
    }
    #boot-login .forgot { display: block; margin-top: 8px; color: #1e4b8c; font-size: 14px; font-weight: 500; }
    #boot-login .copy {
      margin: 16px 0 0;
      padding-top: 12px;
      border-top: 1px solid #e6e8ee;
      color: #6b7280;
      font-size: 11px;
    }
    #boot-login .hint { margin-top: 10px; text-align: center; font-size: 12px; color: #6b7280; }
    #boot-login .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fff;
      padding: 36px;
    }
    #boot-login .hero h2 { margin: 0; font-size: 50px; line-height: 1.15; font-weight: 700; }
    #boot-login .hero p { max-width: 640px; margin: 16px 0 0; color: #6b7280; font-size: 20px; }
    #boot-login .art {
      width: min(520px, 100%);
      height: 290px;
      margin-top: 34px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f4f7fb, #e7eef6);
      border: 1px solid rgba(30, 75, 140, .15);
      color: #1e4b8c;
      font-size: 72px;
    }
    #boot-login.restoring .split { display: none; }
    #boot-login.restoring { align-items: center; justify-content: center; }
    #boot-login .hold {
      display: none;
      width: 26px;
      height: 26px;
      border: 2.4px solid #1e4b8c;
      border-top-color: transparent;
      border-radius: 50%;
      animation: boot-spin .7s linear infinite;
    }
    #boot-login.restoring .hold { display: block; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (max-width: 979px) {
      #boot-login .pane { flex: 1; }
      #boot-login .hero { display: none; }
    }
  </style>
</head>
<body>
  <!-- Instant login chrome while Flutter JS downloads (no branded splash). -->
  <div id="boot-login" aria-label="Employee Login">
    <div class="split">
      <div class="pane">
        <div class="card">
          <div class="brand-row"><img src="logo-mark.svg" alt=""> HR360</div>
          <h1>Welcome Back</h1>
          <p class="sub">Sign in to continue</p>
          <label>Company Name</label>
          <input type="text" value="demo" readonly tabindex="-1">
          <label>UserName</label>
          <input type="text" placeholder="UserName" readonly tabindex="-1">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" readonly tabindex="-1">
          <label class="check"><input type="checkbox" checked disabled tabindex="-1"> Remember Me</label>
          <button type="button">Log in</button>
          <span class="forgot">Forgot your password?</span>
          <p class="copy">© 2026 HR360. All Rights Reserved.</p>
          <div class="hint">Opening login…</div>
        </div>
      </div>
      <aside class="hero">
        <h2>People, payroll,<br>and attendance<br>made simple</h2>
        <p>HR360 helps companies manage employees, leave, payroll, and approvals in one place.</p>
        <div class="art" aria-hidden="true">360</div>
      </aside>
    </div>
    <div class="hold" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      var path = (location.pathname || '').toLowerCase();
      var isSignUp = path.indexOf('sign-up') !== -1 || path.indexOf('signup') !== -1
        || (location.hash || '').toLowerCase().indexOf('sign-up') !== -1;
      var el = document.getElementById('boot-login');
      if (isSignUp) {
        document.title = 'HR360 TechX — Sign Up';
        if (el) {
          el.setAttribute('aria-label', 'Sign Up');
          var card = el.querySelector('.card');
          if (card) {
            card.innerHTML =
              '<div class="brand-row"><img src="logo-mark.svg" alt=""> HR360</div>' +
              '<h1>Let\'s get signed up!</h1>' +
              '<p class="sub">Opening sign-up…</p>';
          }
          var hero = el.querySelector('.hero');
          if (hero) hero.style.display = 'none';
          var pane = el.querySelector('.pane');
          if (pane) pane.style.flex = '1';
        }
        return;
      }
      var hasSession = !!(
        localStorage.getItem('hr360_auth_session_v1') ||
        localStorage.getItem('flutter.hr360_session_json') ||
        localStorage.getItem('flutter.hr360_auth_token')
      );
      if (el && hasSession) el.classList.add('restoring');
    })();
  </script>

  <script src="flutter.js" defer></script>
  <script>
    function removeBootLogin() {
      var el = document.getElementById('boot-login');
      if (el) el.remove();
    }

    window.addEventListener('load', function () {
      if (typeof _flutter === 'undefined') return;
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: null },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            return appRunner.runApp();
          }).then(function () {
            // Drop the HTML shell as soon as Flutter has started.
            setTimeout(removeBootLogin, 50);
          }).catch(function () {
            removeBootLogin();
          });
        }
      });
    });

    // Fallback: if Flutter paints a view, remove the shell.
    var observer = new MutationObserver(function () {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host')) {
        removeBootLogin();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
