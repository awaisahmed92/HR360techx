# Coolify: deploy THIS file as a Docker Compose resource (not a single Dockerfile).
# Services MUST be named `web` and `api` so Caddy can reach api:8000.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://hr360techx.com
      CORS_ALLOWED_ORIGINS: https://hr360techx.com,https://www.hr360techx.com
      DB_CONNECTION: mysql
      # Required in Coolify UI (secrets):
      # APP_KEY=base64:...
      # DB_HOST=...
      # DB_PORT=3306
      # DB_DATABASE=...
      # DB_USERNAME=...
      # DB_PASSWORD=...
      # DB_MASTER_HOST / DB_MASTER_* if using multi-tenant master DB
    # Listen on all interfaces inside the compose network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      # Critical: host:port of the api service (no http://)
      API_UPSTREAM: api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
