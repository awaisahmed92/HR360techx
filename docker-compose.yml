# Coolify: deploy as Docker Compose (services: db + api + web).
# Enable Interpolation for ${DB_*} / ${DB_MASTER_*} values.
# Compose location in Coolify MUST be: /docker-compose.yml
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      # Repo root so Dockerfile can COPY backend/ + database/*.sql
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://hr360techx.com
      CORS_ALLOWED_ORIGINS: https://hr360techx.com,https://www.hr360techx.com
      HR360_SQL_DIR: /var/www/html/database-sql
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MASTER_HOST: ${DB_MASTER_HOST}
      DB_MASTER_PORT: ${DB_MASTER_PORT}
      DB_MASTER_DATABASE: ${DB_MASTER_DATABASE}
      DB_MASTER_USERNAME: ${DB_MASTER_USERNAME}
      DB_MASTER_PASSWORD: ${DB_MASTER_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Set in Coolify secrets:
      # APP_KEY=base64:...
      # HR360_TOKEN_SECRET=...
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      API_UPSTREAM: api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
